  <script type="text/babel" data-presets="react">
    const { useState: uS } = React;

    function norPrice(oere, { compact = false } = {}) {
      const kr = oere / 100;
      if (compact && oere % 100 === 0) return `${kr.toFixed(0)},-`;
      return `${kr.toFixed(2).replace(".", ",")} kr`;
    }

    function Icon({ name, size = 22, stroke = 1.6, color = "currentColor", fill = "none" }) {
      const c = { width:size, height:size, viewBox:"0 0 24 24", fill, stroke:color, strokeWidth:stroke, strokeLinecap:"round", strokeLinejoin:"round" };
      switch (name) {
        case "home":    return <svg {...c}><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>;
        case "grid":    return <svg {...c}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
        case "heart":   return <svg {...c}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>;
        case "heart-f": return <svg {...c} fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>;
        case "bag":     return <svg {...c}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>;
        case "user":    return <svg {...c}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>;
        case "search":  return <svg {...c}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        case "pin":     return <svg {...c}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        case "chev-r":  return <svg {...c}><path d="m9 6 6 6-6 6"/></svg>;
        case "chev-l":  return <svg {...c}><path d="m15 18-6-6 6-6"/></svg>;
        case "plus":    return <svg {...c}><path d="M12 5v14"/><path d="M5 12h14"/></svg>;
        case "minus":   return <svg {...c}><path d="M5 12h14"/></svg>;
        case "star":    return <svg {...c} fill="currentColor" stroke="none"><path d="m12 2 3 7 7 .5-5.5 4.5 2 7L12 17l-6.5 4 2-7L2 9.5 9 9Z"/></svg>;
        case "share":   return <svg {...c}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>;
        case "gift":    return <svg {...c}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>;
        case "ticket":  return <svg {...c}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>;
        default: return null;
      }
    }

    function Chip({ kind = "member", children, sm }) {
      const bg = { member:"var(--rose-50)", sale:"var(--sale)", forest:"var(--forest-700)", new:"var(--ink-900)", cream:"rgba(255,255,255,.95)" }[kind];
      const fg = kind === "member" ? "var(--member)" : kind === "cream" ? "var(--sale)" : "#fff";
      return <span style={{ display:"inline-flex", padding: sm ? "3px 8px" : "4px 10px", borderRadius:9999, fontSize: sm ? 9 : 10, fontWeight:700, letterSpacing:".09em", textTransform:"uppercase", background:bg, color:fg }}>{children}</span>;
    }

    function Price({ price, memberPrice, salePrice, sizeSm }) {
      const big = sizeSm ? 14 : 16;
      const sm  = sizeSm ? 11 : 12;
      if (memberPrice) return (
        <div style={{ display:"flex", alignItems:"baseline", gap:6, fontVariantNumeric:"tabular-nums" }}>
          <span style={{ color:"var(--member)", fontWeight:700, fontSize:big }}>{norPrice(memberPrice, { compact:true })}</span>
          <span style={{ color:"var(--fg-subtle)", textDecoration:"line-through", fontSize:sm }}>{norPrice(price)}</span>
        </div>
      );
      if (salePrice) return (
        <div style={{ display:"flex", alignItems:"baseline", gap:6, fontVariantNumeric:"tabular-nums" }}>
          <span style={{ color:"var(--sale)", fontWeight:700, fontSize:big }}>{norPrice(salePrice)}</span>
          <span style={{ color:"var(--fg-subtle)", textDecoration:"line-through", fontSize:sm }}>{norPrice(price)}</span>
        </div>
      );
      return <span style={{ fontWeight:700, fontSize:big, fontVariantNumeric:"tabular-nums" }}>{norPrice(price)}</span>;
    }

    function Img({ src, alt = "", style = {}, ...rest }) {
      return <img src={src} alt={alt} loading="lazy" style={{ display:"block", width:"100%", height:"100%", objectFit:"cover", background:"var(--cream-200)", ...style }} {...rest}/>;
    }

    function StatusScrim() {
      return <div style={{ position:"absolute", top:0, left:0, right:0, height:54, background:"linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,0))", zIndex:2, pointerEvents:"none" }}/>;
    }

    // ─── App header ─────────────────────────────────────────
    function AppHeader({ onSearch }) {
      return (
        <div style={{ padding:"54px 16px 12px", background:"var(--bg)", position:"sticky", top:0, zIndex:5 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
            <div style={{ fontFamily:"var(--font-display)", fontWeight:600, fontSize:22, letterSpacing:"-.01em", color:"var(--ink-900)" }}>kid</div>
            <div style={{ display:"flex", gap:16, alignItems:"center", color:"var(--fg)" }}>
              <Icon name="pin" size={22}/>
              <Icon name="heart" size={22}/>
            </div>
          </div>
          <div onClick={onSearch} style={{ display:"flex", alignItems:"center", background:"#fff", borderRadius:9999, padding:"11px 16px", gap:10, boxShadow:"inset 0 0 0 1px var(--border)" }}>
            <Icon name="search" size={18} color="var(--fg-muted)"/>
            <span style={{ flex:1, color:"var(--fg-muted)", fontSize:14 }}>Søk produkter, kategorier…</span>
          </div>
        </div>
      );
    }

    // ─── Home screen (personalisert dashboard) ──────────────
    function HomeScreen({ onProduct, onCategory, onClub }) {
      const d = window.kidAppData;
      const m = d.me;
      return (
        <>
          {/* Header */}
          <div style={{ padding:"54px 16px 14px", background:"var(--bg)" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div>
                <div style={{ fontFamily:"var(--font-display)", fontStyle:"italic", fontSize:13, color:"var(--fg-muted)" }}>God dag,</div>
                <div style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:26, letterSpacing:"-.01em", color:"var(--ink-900)" }}>{m.name.split(" ")[0]} 👋</div>
              </div>
              <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                <button style={{ border:0, background:"transparent", padding:0, cursor:"pointer", color:"var(--fg)" }}>
                  <Icon name="search" size={22}/>
                </button>
                <button style={{ border:0, background:"transparent", padding:0, cursor:"pointer", color:"var(--fg)" }}>
                  <Icon name="heart" size={22}/>
                </button>
              </div>
            </div>
          </div>

          {/* Poeng-banner */}
          <div style={{ padding:"0 16px 20px" }}>
            <button onClick={onClub} style={{ width:"100%", border:0, padding:0, background:"transparent", cursor:"pointer", textAlign:"left" }}>
              <div style={{ borderRadius:16, overflow:"hidden", position:"relative", background:"linear-gradient(135deg, #9B4E3F, #2D1A12)", padding:"18px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div style={{ color:"#fff" }}>
                  <div style={{ fontFamily:"var(--font-display)", fontStyle:"italic", fontSize:12, opacity:.8, marginBottom:4 }}>Interiørklubb · Gull</div>
                  <div style={{ fontFamily:"var(--font-display)", fontWeight:600, fontSize:28, letterSpacing:"-.02em" }}>{d.totalStamps * 50} poeng</div>
                  <div style={{ fontSize:12, opacity:.75, marginTop:3 }}>{d.stamps}/{10} kjøp til neste belønning</div>
                </div>
                <div style={{ textAlign:"right", color:"#fff" }}>
                  <div style={{ fontFamily:"var(--font-display)", fontWeight:600, fontSize:20, letterSpacing:"-.01em", marginBottom:6 }}>kid</div>
                  <div style={{ display:"flex", gap:4 }}>
                    {Array.from({length:10}).map((_,i) => (
                      <div key={i} style={{ width:14, height:14, borderRadius:9999, background: i < d.stamps ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.25)" }}/>
                    ))}
                  </div>
                </div>
              </div>
            </button>
          </div>

      const toFree = Math.max(0, threshold - sub);
      const pct = Math.min(100, (sub / threshold) * 100);
      const saved = cart.reduce((s, i) => s + ((i.price - (i.memberPrice || i.salePrice || i.price)) * i.qty), 0);
      return (
        <>

              </div>
              <div style={{ background:"var(--cream-100)", borderRadius:14, padding:"16px 18px" }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:".08em", textTransform:"uppercase", color:"var(--fg-muted)", marginBottom:6 }}>Neste belønning</div>
                <div style={{ fontFamily:"var(--font-display)", fontWeight:600, fontSize:30, color:"var(--ink-900)", letterSpacing:"-.02em" }}>{stampsToNext}</div>
                <div style={{ fontSize:11, color:"var(--fg-muted)", marginTop:2 }}>kjøp igjen</div>
              </div>
            </div>
          </div>

          {/* Stamp tracker */}
          <div style={{ padding:"18px 16px 0" }}>
            <div style={{ background:"#fff", borderRadius:16, padding:"18px 16px", boxShadow:"0 1px 2px rgba(45,30,20,.04)" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:14 }}>
                <div style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:18 }}>Stempelkort</div>
                <div style={{ fontSize:12, color:"var(--fg-muted)" }}>{stamps} / {nextReward} kjøp</div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5, 1fr)", gap:8, marginBottom:8 }}>
                {Array.from({ length: nextReward }).map((_, i) => (
                  <div key={i} style={{ aspectRatio:"1/1", borderRadius:9999, display:"flex", alignItems:"center", justifyContent:"center", background: i < stamps ? "var(--rose-500)" : "var(--ink-100)" }}>
                    {i < stamps && <Icon name="star" size={12} color="#fff"/>}
                  </div>
                ))}
              </div>
              <div style={{ fontSize:12, color:"var(--fg-muted)" }}>{stampsToNext} kjøp til <b style={{ color:"var(--fg)" }}>200 kr rabatt</b></div>
            </div>
          </div>

          {/* Member benefits */}
          <div style={{ padding:"20px 16px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:12 }}>
              <div style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:20 }}>Dine tilbud</div>
              <span style={{ fontSize:12, color:"var(--rose-700)", fontWeight:600 }}>{d.memberOffers.length} aktive</span>
            </div>
            {d.memberOffers.map((offer, i) => (
              <button key={i} onClick={() => onOffer && onOffer(offer)} style={{ width:"100%", border:0, padding:0, background:"transparent", textAlign:"left", cursor:"pointer", marginBottom:12 }}>
                <div style={{ borderRadius:14, overflow:"hidden", background:"#fff", display:"grid", gridTemplateColumns:"100px 1fr", minHeight:100, boxShadow:"0 1px 4px rgba(45,30,20,.06)" }}>
                  <div style={{ position:"relative" }}>
                    <Img src={offer.img}/>
                    {offer.discount && (
                      <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(31,24,19,.35)" }}>
                        <span style={{ fontFamily:"var(--font-display)", fontWeight:600, fontSize:22, color:"#fff", letterSpacing:"-.02em" }}>{offer.discount}</span>
                      </div>
                    )}
                  </div>
                  <div style={{ padding:"14px 14px", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
                    <div>
                      <div style={{ display:"inline-flex", marginBottom:6 }}>
                        <Chip kind="member" sm>{offer.tag}</Chip>
                      </div>
                      <div style={{ fontSize:13, fontWeight:600, color:"var(--fg)", lineHeight:1.35 }}>{offer.title}</div>
                    </div>
                    <div style={{ fontSize:11, color:"var(--fg-muted)", marginTop:6 }}>{offer.expires}</div>
                  </div>
                </div>
              </button>
            ))}
          </div>

          {/* Perks list */}
          <div style={{ padding:"8px 16px 24px" }}>
            <div style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:20, marginBottom:12 }}>Medlemsfordeler</div>
            <div style={{ background:"#fff", borderRadius:14, overflow:"hidden", boxShadow:"0 1px 2px rgba(45,30,20,.04)" }}>
              {[
                { icon:"gift",   title:"200,- i velkomstrabatt",          desc:"Brukes ved neste kjøp"         },
                { icon:"star",   title:"Poeng på alle kjøp",              desc:"1 poeng per 10 kr brukt"       },
                { icon:"ticket", title:"Eksklusive tilbud",               desc:"Kun for klubbmedlemmer"        },
                { icon:"bag",    title:"Fri frakt fra 799,-",             desc:"Alltid for deg som er medlem"  },
              ].map((b, i, a) => (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 16px", borderBottom: i < a.length-1 ? "1px solid var(--ink-100)" : 0 }}>
                  <div style={{ width:36, height:36, borderRadius:9999, background:"var(--rose-50)", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--rose-700)", flexShrink:0 }}>
                    <Icon name={b.icon} size={16}/>
                  </div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:"var(--fg)" }}>{b.title}</div>
                    <div style={{ fontSize:11, color:"var(--fg-muted)", marginTop:1 }}>{b.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }

    // ─── Me screen ───────────────────────────────────────────
    function MeScreen() {
      const m = window.kidAppData.me;
      return (
        <>
          <div style={{ padding:"54px 16px 12px" }}>
            <div style={{ fontFamily:"var(--font-display)", fontStyle:"italic", fontSize:13, color:"var(--fg-muted)" }}>Velkommen tilbake</div>
            <h1 style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:30, letterSpacing:"-.01em", margin:"2px 0 0" }}>Meg</h1>
          </div>
          <div style={{ padding:"14px 16px" }}>
            <div style={{ display:"flex", alignItems:"center", gap:14, padding:"16px 18px", background:"var(--rose-50)", borderRadius:16, marginBottom:20 }}>
              <div style={{ width:48, height:48, borderRadius:9999, background:"var(--rose-500)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontFamily:"var(--font-display)", fontWeight:600, fontSize:22, flexShrink:0 }}>
                {m.name.charAt(0)}
              </div>
              <div>
                <div style={{ fontFamily:"var(--font-display)", fontWeight:500, fontSize:18, color:"var(--ink-900)" }}>{m.name}</div>
                <div style={{ fontSize:12, color:"var(--rose-700)", fontWeight:600, marginTop:2 }}>✦ Gull-medlem · {m.points}</div>
              </div>
            </div>
            <div style={{ background:"#fff", borderRadius:14, overflow:"hidden", boxShadow:"0 1px 2px rgba(45,30,20,.04)" }}>
              {["Mine bestillinger","Adresser","Betalingsmetoder","Varsler","Personvern","Kundeservice","Logg ut"].map((r, i, a) => (
                <button key={i} style={{ width:"100%", display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px", border:0, background:"transparent", fontFamily:"inherit", fontSize:14, color: r === "Logg ut" ? "var(--rose-700)" : "var(--fg)", borderBottom: i < a.length-1 ? "1px solid var(--ink-100)" : 0, cursor:"pointer", textAlign:"left" }}>
                  <span>{r}</span>
                  {r !== "Logg ut" && <Icon name="chev-r" size={16} color="var(--fg-muted)"/>}
                </button>
              ))}
            </div>
          </div>
        </>
      );
    }

    // ─── Tab bar ─────────────────────────────────────────────
    function TabBar({ current, onChange, cartCount }) {
      return (
        <div style={{ flexShrink:0, paddingBottom:28, paddingTop:10, background:"rgba(251,247,241,.96)", backdropFilter:"blur(14px)", borderTop:"1px solid var(--border)", zIndex:40, display:"flex" }}>
          {window.kidAppData.tabs.map(t => {
            const active = current === t.key;
            return (
              <button key={t.key} onClick={() => onChange(t.key)} style={{ flex:1, border:0, background:"transparent", padding:"4px 0 2px", display:"flex", flexDirection:"column", alignItems:"center", gap:3, cursor:"pointer", color: active ? "var(--ink-900)" : "var(--ink-500)" }}>
                <div style={{ position:"relative" }}>
                  <Icon name={t.icon} size={22} stroke={active ? 1.9 : 1.6}/>
                  {t.key === "cart" && cartCount > 0 && (
                    <span style={{ position:"absolute", top:-4, right:-8, background:"var(--rose-500)", color:"#fff", fontSize:9, fontWeight:700, borderRadius:9999, padding:"1px 5px", minWidth:14, textAlign:"center" }}>{cartCount}</span>
                  )}
                </div>
                <span style={{ fontSize:10, fontWeight: active ? 600 : 500 }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    // ─── App root ─────────────────────────────────────────────
    function KidApp() {
      const [tab, setTab] = uS("home");
      const [stack, setStack] = uS([]);
      const [cart, setCart] = uS(window.kidAppData.initialCart);

      const onProduct = (p) => setStack(s => [...s, { screen:"product", product:p }]);
      const onBack = () => setStack(s => s.slice(0, -1));
      const addToCart = (p) => {
        setCart(c => {
          const ix = c.findIndex(i => i.name === p.name);
          if (ix >= 0) { const n = [...c]; n[ix] = { ...n[ix], qty: n[ix].qty + 1 }; return n; }
          return [...c, { ...p, qty:1 }];
        });
        setStack([]);
        setTab("cart");
      };
      const inc = (i) => setCart(c => c.map((x, ix) => ix === i ? { ...x, qty: x.qty + 1 } : x));
      const dec = (i) => setCart(c => c.map((x, ix) => ix === i ? { ...x, qty: Math.max(1, x.qty - 1) } : x));
      const rem = (i) => setCart(c => c.filter((_, ix) => ix !== i));
      const cartCount = cart.reduce((s, i) => s + i.qty, 0);
      const onTab = (k) => { setStack([]); setTab(k); };

      let screen;
      const top = stack[stack.length - 1];
      if (top?.screen === "product") screen = <ProductScreen product={top.product} onBack={onBack} onAdd={addToCart}/>;
      else if (tab === "home")  screen = <HomeScreen onProduct={onProduct} onCategory={() => setTab("shop")} onClub={() => setTab("club")}/>;
      else if (tab === "shop")  screen = <CategoryScreen onProduct={onProduct}/>;
      else if (tab === "club")  screen = <ClubScreen/>;
      else if (tab === "cart")  screen = <CartScreen cart={cart} onInc={inc} onDec={dec} onRemove={rem}/>;
      else if (tab === "me")    screen = <MeScreen/>;

      const showTabBar = !top;

      return (
        <div style={{ minHeight:"100vh", background:"var(--cream-200)", display:"flex", alignItems:"center", justifyContent:"center", padding:"24px 0" }}>
          <IOSDevice>
            <div style={{ height:"100%", display:"flex", flexDirection:"column", background:"var(--bg)" }}>
              <div style={{ flex:1, overflowY:"auto" }}>
                {screen}
              </div>
              {showTabBar && <TabBar current={tab} onChange={onTab} cartCount={cartCount}/>}
            </div>
          </IOSDevice>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<KidApp/>);
  </script>
</body>
</html>
